id = "huggingface"
name = "Hugging Face cache"
vendor = "Hugging Face"
docs = ["https://huggingface.co/docs/huggingface_hub/guides/manage-cache"]
policy = "Downloaded models and datasets stay until you delete them."
cleanup = "hf cache scan  /  hf cache delete"
processes = []
