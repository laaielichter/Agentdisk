name: Release

# Runs when a version tag is pushed (`git tag v0.2.1 && git push origin v0.2.1`; the workflow creates the
# release) or when a release is published on GitHub (the release creates the tag).
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        shell: bash
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "${GITHUB_REF_NAME}" != "v${crate}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate} (expected v${crate})."
            exit 1
          fi

  build:
    needs: version
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: "" }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p agentdisk --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name=agentdisk-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir -p dist/$name
          cp target/${{ matrix.target }}/release/agentdisk${{ matrix.ext }} dist/$name/
          cp README.md LICENSE LICENSE-APACHE dist/$name/
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a $name.zip $name >/dev/null
          else
            tar czf $name.tar.gz $name
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: agentdisk-${{ matrix.target }}
          path: dist/*.*z*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          name: agentdisk ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
