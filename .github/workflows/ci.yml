name: CI

# Manual for now: hosted runners are not available for this repository.
# Run ./scripts/check.ps1 (Windows) or ./scripts/check.sh locally instead.
# To run on every push again, add:  push: { branches: [main] }  and  pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all --locked
      - name: Smoke test
        shell: bash
        run: |
          cargo run -q -p agentdisk -- --version
          cargo run -q -p agentdisk -- adapters
          cargo run -q -p agentdisk -- scan -p .
          cargo run -q -p agentdisk -- check
          cargo run -q -p agentdisk -- size .
      - name: Plugin manifests are valid JSON
        shell: bash
        run: |
          for f in .claude-plugin/plugin.json .claude-plugin/marketplace.json .mcp.json hooks/hooks.json gemini-extension.json; do
            python3 -m json.tool "$f" > /dev/null || { echo "invalid: $f"; exit 1; }
          done
